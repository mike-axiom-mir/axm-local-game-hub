name: Sealed distribution integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-sealed-distribution:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Regression tests
        run: node --test tests/file-integrity.test.cjs
      - name: Verify frozen distribution bytes
        run: node tools/verify-file-integrity.cjs .
