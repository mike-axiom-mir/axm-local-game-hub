name: Managed runtime lifecycle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-runtime-exit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Runtime lifecycle regression tests
        run: node --test tests/runtime-process.test.cjs
