name: Publish 2026-09-13 public checkpoint

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/public-checkpoint-release-20260913.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create prerelease checkpoint once
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: public-checkpoint-2026-09-13
          STAGE: "Active post-release experimental main; v0.1.0-proof-of-start remains the earlier packaged four-game checkpoint."
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          repo_name="${GITHUB_REPOSITORY#*/}"
          printf '%s\n\n%s\n\n%s\n\n%s\n' "Public experimental checkpoint of ${repo_name}." "Current public stage: ${STAGE}" "This prerelease records the exact repository state at the tagged commit. It is a source checkpoint and does not silently claim that newer main-branch work exists in the older v0.1.0 packaged ZIP." "AXM-owned source is Apache-2.0; third-party material retains its own upstream terms. Read README.md and LICENSE_STATUS.md for details." > release-notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "${repo_name} — Public Checkpoint 2026-09-13" --notes-file release-notes.md --prerelease
