name: Runtime transition serialization

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-runtime-transition-serialization:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Concurrent launch regression
        run: node --test tests/runtime-transition-serialization.test.cjs
      - name: Existing runtime lifecycle regression
        run: node --test tests/runtime-process.test.cjs
      - name: Verify sealed distribution evidence
        run: node tools/verify-file-integrity.cjs .
