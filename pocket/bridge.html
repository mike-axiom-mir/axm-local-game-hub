<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AXM Pocket Bridge</title><style>html,body{margin:0;min-height:100%;background:#080b14;color:#f5f7ff;font-family:system-ui,-apple-system,sans-serif}body{min-height:100vh;display:grid;place-items:center}.card{box-sizing:border-box;width:min(88vw,430px);padding:30px;border:1px solid #29314b;border-radius:28px;background:#111626;text-align:center;box-shadow:0 22px 80px #0008}.mark{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;font-weight:900;font-size:24px;background:linear-gradient(135deg,#5ce1e6,#9469ff)}h1{font-size:25px;letter-spacing:.12em;margin:0 0 24px}#status{font-size:19px;font-weight:800;color:#fff}p{line-height:1.5;color:#bac3da}button{border:0;border-radius:14px;padding:14px 22px;background:#8f72ff;color:white;font-weight:800}</style></head><body><main class="card"><div class="mark">AX</div><h1>AXM POCKET</h1><p id="status">Opening phone bridge…</p><p id="detail">QR = address. Network = engine.</p><button id="retry" hidden>Retry</button></main><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>(()=>{'use strict';const q=new URLSearchParams(location.search),engineOnly=q.has('engine')&&!q.has('join'),host=q.get('engine')||q.get('join'),status=document.getElementById('status'),detail=document.getElementById('detail'),retry=document.getElementById('retry');retry.onclick=()=>location.reload();const fail=m=>{status.textContent='Could not connect';detail.textContent=m;retry.hidden=false};const saveHtml=html=>{try{const u=URL.createObjectURL(new Blob([html],{type:'text/html'})),a=document.createElement('a');a.href=u;a.download='AXM_POCKET_ONE_SCAN.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}catch(_){}};if(!host){status.textContent='AXM Pocket bridge ready';detail.textContent='Scan the QR shown by an AXM Pocket phone.';return}if(typeof Peer!=='function'){fail('Online bridge library did not load. Check mobile data and retry.');return}status.textContent='Finding AXM Pocket phone…';detail.textContent='The QR only introduced the phones. The real engine will come from the host phone.';const peer=new Peer(undefined,{debug:0});let received=false;peer.on('open',()=>{const c=peer.connect(host,{reliable:true,serialization:'binary',metadata:{axm:'axm-pocket-bootstrap',purpose:'engine'}});c.on('open',()=>{status.textContent='Host found · receiving engine…'});c.on('data',d=>{if(received||!d||d.type!=='AXM_ENGINE_HTML'||typeof d.html!=='string')return;received=true;status.textContent=engineOnly?'Engine received · saving HTML…':'Engine received · opening…';if(engineOnly)saveHtml(d.html);try{peer.destroy()}catch(_){}setTimeout(()=>{document.open();document.write(d.html);document.close()},engineOnly?350:0)});c.on('error',e=>fail(e&&e.message?e.message:'Direct engine transfer failed.'));c.on('close',()=>{if(!received)fail('Host closed before the engine arrived. Ask for a fresh QR.')})});peer.on('error',e=>fail(e&&e.type==='peer-unavailable'?'That host QR expired. Ask for a fresh QR.':(e&&e.message?e.message:'Online signaling failed.')));})();</script></body></html>
